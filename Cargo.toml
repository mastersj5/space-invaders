[package]
name = "space-invaders"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.14.0"
rand = "0.8.5"
getrandom_0_2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.23", features = ["js"] }

# Enable max optimizations for dependencies, but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Maximize release performance
[profile.release]
lto = "thin"
opt-level = 3
